aid: pratt-and-whitney
name: Pratt & Whitney
description: >-
  A major American aerospace manufacturer designing, manufacturing, and
  servicing aircraft engines for commercial, military, and business aviation
  applications. A division of RTX Corporation (formerly Raytheon Technologies),
  Pratt & Whitney is known for its geared turbofan (GTF) engine technology
  (PW1000G family) powering the Airbus A220 and A320neo, the F135 powering the
  F-35 Joint Strike Fighter, and the PT6 turboprop family. Customer-facing
  digital services - EngineWise health monitoring, FAST (Full-flight data
  Acquisition Storage and Transmission), and the Customer Portal - are operated
  privately for airline, MRO, and military customers behind credentialed access
  and are not exposed as a public developer API or open partner integration
  portal.
